name: Build APK

# Builds the debug APK and runs the unit tests on every push to the working
# branch. The APK is published two ways:
#   1. as a downloadable workflow artifact (GitHub UI / gh run download)
#   2. committed to the `builds/replock-apk` branch (so it can be fetched with git)
on:
  push:
    branches: [arena/4546cc7a-replock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (rep counter state machine)
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: replock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to builds/replock-apk branch
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds/replock-apk
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p app/build/outputs/apk/debug
          cp "$APK" app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" RepLock-debug.apk
          cat > README.md <<EOF
          # RepLock debug APK (auto-built by GitHub Actions)

          - APK: \`RepLock-debug.apk\` (also at \`app/build/outputs/apk/debug/app-debug.apk\`)
          - Size: $SIZE bytes
          - Built from branch \`arena/4546cc7a-replock\`
          - Install: \`adb install -r RepLock-debug.apk\`
          EOF
          git add -A
          git commit -m "APK build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin builds/replock-apk
