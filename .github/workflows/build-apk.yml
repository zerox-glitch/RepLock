name: Build APK

# Builds the debug APK and runs the unit tests on every push to the working
# branch. Publishes:
#   1. the APK as a workflow artifact + committed to `builds/replock-apk`
#   2. full gradle logs + test reports committed to `builds/ci-logs`
#      (so failures can be diagnosed even where the Actions log host is blocked)
on:
  push:
    branches: [arena/4546cc7a-replock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (rep counter state machine)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: replock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to builds/replock-apk branch
        if: always()
        run: |
          set -o pipefail
          {
            set -x
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            APK=app/build/outputs/apk/debug/app-debug.apk
            # Save everything we want to keep before wiping the working tree.
            cp -r app/build/test-results/testDebugUnitTest /tmp/test-results 2>/dev/null || true
            cp -r app/build/reports/tests/testDebugUnitTest /tmp/test-report 2>/dev/null || true
            if [ -f "$APK" ]; then
              SIZE=$(stat -c%s "$APK")
              echo "APK size: $SIZE bytes"
              cp "$APK" /tmp/replock-debug.apk
              git checkout --orphan builds/replock-apk
              git rm -rf . > /dev/null 2>&1 || true
              git clean -fdxq || true
              mkdir -p app/build/outputs/apk/debug
              cp /tmp/replock-debug.apk app/build/outputs/apk/debug/app-debug.apk
              cp /tmp/replock-debug.apk RepLock-debug.apk
              printf '# RepLock debug APK (auto-built by GitHub Actions)\n\n- APK: `RepLock-debug.apk` (also at `app/build/outputs/apk/debug/app-debug.apk`)\n- Size: %s bytes\n- Built from branch `arena/4546cc7a-replock`\n- Install: `adb install -r RepLock-debug.apk`\n' "$SIZE" > README.md
              git add -A
              git commit -m "APK build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git push --force origin builds/replock-apk
            else
              echo "APK missing - build failed, see builds/ci-logs (last good APK branch left untouched)"
            fi
          } 2>&1 | tee /tmp/publish-apk.log

      - name: Publish logs to builds/ci-logs branch
        if: always()
        run: |
          set -o pipefail
          {
            set -x
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan builds/ci-logs
            git rm -rf . > /dev/null 2>&1 || true
            git clean -fdxq || true
            mkdir -p logs
            cp /tmp/test.log logs/test.log 2>/dev/null || true
            cp /tmp/build.log logs/build.log 2>/dev/null || true
            cp /tmp/publish-apk.log logs/publish-apk.log 2>/dev/null || true
            cp -r /tmp/test-results logs/test-results 2>/dev/null || true
            cp -r /tmp/test-report logs/test-report 2>/dev/null || true
            echo "# RepLock CI logs (auto-published by GitHub Actions)" > README.md
            git add -A
            git commit -m "CI logs $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git push --force origin builds/ci-logs || true
          } 2>&1 | tee /tmp/publish-logs.log
